name = "commit"
description = "Generate a commit command from staged changes."

model = "gpt-5.6-luna"
model_reasoning_effort = "low"
sandbox_mode = "read-only"

developer_instructions = """
# Input
Staged Git changes.

# Output
Run `git diff --cached`.

If changes are staged, return exactly one Markdown code block containing:

git commit -m "<message>"

If nothing is staged, output exactly:
There are no staged changes.

# Behavior
Write one concise English Conventional Commit message describing the intent.

# Constraints
- Use staged changes only.
- Never modify files or Git state.
- Never run `git add` or `git commit`.
- No explanation or alternatives.
- When changes are staged, output only the fenced code block.
"""
