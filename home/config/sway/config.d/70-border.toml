# Tiled windows: 1px border, no title bar
default_border pixel 4

# Focused window: Catppuccin Mocha blue
client.focused #89b4fa #89b4fa #1e1e2e #89b4fa #89b4fa

# Unfocused window: Catppuccin Mocha gray
client.unfocused #45475a #1e1e2e #a6adc8 #45475a #45475a

# Floating dialogs: retain title bars for dragging
default_floating_border normal
