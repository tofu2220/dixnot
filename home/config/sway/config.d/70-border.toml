# Tiled windows: 1px border, no title bar
default_border pixel 4

# Focused window: Catppuccin Latte blue
client.focused #1e66f5 #1e66f5 #eff1f5 #1e66f5 #1e66f5

# Unfocused window: Latte muted gray
client.unfocused #9ca0b0 #eff1f5 #6c6f85 #9ca0b0 #9ca0b0

# Floating dialogs: retain title bars for dragging
default_floating_border normal
